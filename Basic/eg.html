<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }

    .container{
        border: 2px solid black;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }


    .card{
        border: 2px solid black;
        height: 80%;
        width: 35%;
        background-color: bisque;
    }

    .img{
        height: 70%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
    }
     

    .box{
        height: 20%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
        background-color: lightblue;
    }


    button{
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px;
        width: 100%;
        margin-top: 2px;
    }



</style>
<body>
    <div class="container">
    <div class="card">
      <div class="img">
        <img src="headphone.png" alt="headphone">
      </div>
       <div class="box">This is a wireless headphone.</div>
       <div >
        <button>Add To Cart</button>
       </div>
   </div>
    </div>
   
</body>
</html>
