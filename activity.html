<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
.container{
   background-color: aqua;
   height: 100vh;
   border: 1px solid black;
   display:flex;
   justify-content: center;
   align-items: center;
   
}

.cart{
    background-color: bisque;
    border: 2px solid black;
    height: 80%;
    width: 30%;
    border-radius: 10px;
    padding: 10px;
}

.box1{
    height: 60%;
    border: 2px solid lightgray;
    background-color: lightgray;
}
.box2{
    height: 40%;
    margin-top: 10px;
    font-size: 18px;
    padding: 15px;
}
.box2 p{
    height: 50%;
}
.box2 button{
    background-color:cornflowerblue;
    height: 20%;
    width: 100%;
    border: none;
    border-radius: 10px;
}

.box2 img{
    height: 100%;
    width: 100%;
    object-fit: contain;
}
</style>
<body>
    <div class="container">
        <div class="cart">
            <div class="box1">
                <img src="headphone.png" alt="headphone">
            </div>
            <div class="box2">
                <h1>Boat Headphones</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam est tempore voluptates?</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </div>
    
</body>
</html>
